name: OnlineNow
options:
  bundleIdPrefix: com.gdemay
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: '15.0'
targets:
  OnlineNow:
    type: application
    platform: iOS
    supportedDestinations:
    - iOS
    sources:
    - App
    - Sources/OnlineNow
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Online Now
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSExceptionDomains:
            captive.apple.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gdemay.onlinenow
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: 1,2
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 3
        DEVELOPMENT_TEAM: MV634X2D7X
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: 'YES'
        CODE_SIGNING_ALLOWED: 'YES'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Online Now
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_BITCODE: false
        VALIDATE_PRODUCT: true
  OnlineNowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - Tests/OnlineNowTests
    - Tests/OnlineNowCoreTests
    resources:
    - Configuration.storekit
    dependencies:
    - target: OnlineNow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gdemay.onlinenow.OnlineNowTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.0'
  OnlineNowUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - Tests/OnlineNowUITests
    resources:
    - Configuration.storekit
    dependencies:
    - target: OnlineNow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gdemay.onlinenow.OnlineNowUITests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.0'
schemes:
  OnlineNow:
    build:
      targets:
        OnlineNow: all
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
      targets:
      - OnlineNowTests
      - OnlineNowUITests
      gatherCoverageData: true
    archive:
      config: Release
