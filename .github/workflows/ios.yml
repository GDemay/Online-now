name: Refresh public website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request-pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the configured Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status,url}'
